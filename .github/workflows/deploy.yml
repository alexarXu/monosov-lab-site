name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DREAMHOST_HOST }}
      USER: ${{ secrets.DREAMHOST_USER }}
      TARGET: ${{ secrets.DREAMHOST_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # The DreamHost user is SFTP-only (no shell), so rsync over SSH is not available.
      - name: Upload site over SFTP
        run: |
          lftp -u "$USER," "sftp://$HOST" -e "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_ed25519';
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob tools/ \
              --exclude-glob README.md --exclude-glob .DS_Store \
              ./ $TARGET/;
            bye
          "
