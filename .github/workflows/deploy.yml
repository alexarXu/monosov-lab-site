name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DREAMHOST_HOST }}
      USER: ${{ secrets.DREAMHOST_USER }}
      TARGET: ${{ secrets.DREAMHOST_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload site
        run: |
          rsync -avz \
            --exclude ".git*" --exclude ".github" --exclude "README.md" --exclude ".DS_Store" \
            ./ "$USER@$HOST:$TARGET/"
