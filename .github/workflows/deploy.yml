name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DREAMHOST_HOST }}
      USER: ${{ secrets.DREAMHOST_USER }}
      TARGET: ${{ secrets.DREAMHOST_PATH }}
      LFTP_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload site over SFTP
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* --exclude-glob .github/ \
              --exclude-glob README.md --exclude-glob .DS_Store \
              ./ $TARGET/;
            bye
          "
